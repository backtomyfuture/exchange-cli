name: Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: python scripts/check_release_versions.py
      - run: ruff check exchange_cli/ tests/ scripts/
      - run: pytest tests/ -v
      - name: Smoke-test installed console script
        run: python -c "import subprocess, exchange_cli; out=subprocess.check_output(['exchange-cli','--version'], text=True); assert exchange_cli.__version__ in out"
