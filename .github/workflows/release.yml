name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: python scripts/check_release_versions.py --tag "${GITHUB_REF_NAME}"
      - run: ruff check exchange_cli/ tests/ scripts/
      - run: pytest tests/ -q

  build-platform:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-latest
            python-version: "3.12"
            architecture: arm64
            binary: npm/platforms/darwin-arm64/bin/exchange-cli
          - platform: darwin-x64
            runner: macos-15-intel
            python-version: "3.12"
            architecture: x64
            binary: npm/platforms/darwin-x64/bin/exchange-cli
          - platform: linux-x64
            runner: ubuntu-latest
            python-version: "3.12"
            architecture: x64
            binary: npm/platforms/linux-x64/bin/exchange-cli
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            python-version: "3.12"
            architecture: arm64
            binary: npm/platforms/linux-arm64/bin/exchange-cli
          - platform: win32-x64
            runner: windows-latest
            python-version: "3.12"
            architecture: x64
            binary: npm/platforms/win32-x64/bin/exchange-cli.exe
          - platform: win32-ia32
            runner: windows-latest
            python-version: "3.12"
            architecture: x86
            binary: npm/platforms/win32-ia32/bin/exchange-cli.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          architecture: ${{ matrix.architecture }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - run: python -m pip install --upgrade pip
      - run: pip install -e . pyinstaller
      - run: python scripts/prepare_platform_package.py --platform ${{ matrix.platform }}
      - name: Smoke-test packaged binary
        run: python -c "import subprocess; subprocess.run([r'${{ matrix.binary }}', '--version'], check=True)"
      - name: Pack platform npm package
        run: >-
          python -c "from pathlib import Path; Path('release-artifacts').mkdir(exist_ok=True)"
          && npm pack ./npm/platforms/${{ matrix.platform }} --pack-destination release-artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: platform-${{ matrix.platform }}
          path: release-artifacts/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish-npm:
    runs-on: ubuntu-latest
    needs: build-platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - uses: actions/download-artifact@v4
        with:
          pattern: platform-*
          path: release-artifacts/platforms
          merge-multiple: true
      - name: Verify all platform packages are present
        run: >-
          python -c "from pathlib import Path; files=list(Path('release-artifacts/platforms').glob('*.tgz'));
          assert len(files) == 6, f'Expected 6 platform tarballs, found {len(files)}: {files}'"
      - name: Pack main npm package
        run: >-
          python -c "from pathlib import Path; Path('release-artifacts/main').mkdir(parents=True, exist_ok=True)"
          && npm pack ./npm/exchange-cli --pack-destination release-artifacts/main
      - name: Publish all platform packages
        run: python scripts/publish_npm_tarballs.py release-artifacts/platforms/*.tgz
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish main package last
        run: python scripts/publish_npm_tarballs.py release-artifacts/main/*.tgz
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
