[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "exchange-cli"
dynamic = ["version"]
description = "CLI for on-premises Microsoft Exchange Server - designed for AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
keywords = ["exchange", "exchange-server", "ews", "cli", "email", "ai-agent"]
authors = [{ name = "Jarod" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Topic :: Communications :: Email",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "click>=8.1,<9",
    "exchangelib>=5.0",
    # cryptography 49 removed the macOS x86_64 and Win32 wheels used by the release matrix.
    "cryptography>=41.0,<49",
    "beautifulsoup4>=4.12",
    "markdownify>=0.14",
]

[project.scripts]
exchange-cli = "exchange_cli.main:cli"

[project.urls]
Homepage = "https://github.com/backtomyfuture/exchange-cli"
Issues = "https://github.com/backtomyfuture/exchange-cli/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live_exchange: read-only smoke tests against an explicitly enabled local Exchange Server",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.dynamic]
version = {attr = "exchange_cli.__version__"}
